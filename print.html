<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prodigy Psychology printable practice</title><style>body{font:12pt/1.5 Arial,sans-serif;max-width:780px;margin:32px auto;padding:0 20px;color:#111}h1{font-size:22pt}h2{font-size:16pt}h3{font-size:13pt}.part{break-inside:avoid;margin:18px 0}.working{border-bottom:1px solid #aaa;background:repeating-linear-gradient(white,white 25px,#ddd 26px,white 27px)}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:8px;text-align:left}.actions{padding:18px;border:1px solid #ddd}button{padding:10px 20px;font:inherit}.marks{float:right;font-weight:bold}@media print{.actions{display:none}body{margin:0;max-width:none}@page{size:A4;margin:18mm}}</style><div class="actions"><button onclick="window.print()">Print / save as PDF</button> Use your browser’s print dialog.</div><main id="paper">Loading paper…</main><script src="course-data.js"></script><script src="psych-tools.js"></script><script src="paper-data.js"></script><script>
(()=>{'use strict';const args=new URLSearchParams(location.search),p=PAPERS.find(p=>p.id===args.get('paper')),answers=args.get('answers')==='1',el=document.getElementById('paper');if(!p){el.innerHTML='<h1>Paper not found</h1><p>Choose your options on the course page and open a printable paper from there.</p>';return;}document.title=p.title+(answers?' · mark scheme':' · question paper');el.innerHTML=`<h1>${p.title}${answers?' · Indicative mark scheme':''}</h1><p>AQA 7182 · exams 2027 onwards · ${p.marks} marks · ${p.minutes} minutes</p><p><b>Original, unofficial Prodigy practice.</b> Not an AQA paper or prediction. Scores have no official grade boundaries.</p><p><b>Coverage:</b> ${p.coverage.join('; ')}.</p>${answers?'<p>Essays are marked holistically: choose the best-fitting level and then a defensible mark. Indicative content is not a point-per-mark checklist. Credit other accurate, relevant material.</p>':'<p>Name: ____________________ Date: _______________</p><p>Answer every question in this selected paper. Use a calculator for numerical questions. Show calculations and develop your written responses.</p>'}${p.questions.map((q,i)=>`<section><h2>${i+1}. ${q.title}</h2>${q.stem||''}${q.parts.map((a,j)=>`<div class="part"><span class="marks">[${a.m}]</span><h3>${i+1}.${j+1}</h3><div>${a.q}</div>${a.opts?'<ol type="A">'+a.opts.map(o=>'<li>'+o+'</li>').join('')+'</ol>':''}${answers?(a.note?'<p><i>'+a.note+'</i></p>':'')+(a.lor?'<table><thead><tr><th>Marks</th><th>Quality of response</th></tr></thead><tbody>'+a.lor.map(([band,description])=>'<tr><td>'+band+'</td><td>'+description+'</td></tr>').join('')+'</tbody></table><h4>Indicative content</h4><ul>'+a.ind.map(t=>'<li>'+t+'</li>').join('')+'</ul>':'<ol>'+a.ms.map(t=>'<li>'+t+'</li>').join('')+'</ol>'):'<div class="working" style="height:'+Math.max(70,a.m*26)+'px"></div>'}</div>`).join('')}</section>`).join('')}<p>End · Total ${p.marks} marks</p>`;})();
</script></html>
